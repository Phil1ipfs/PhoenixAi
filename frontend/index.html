<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PHOENIX AI</title>
    <script>
      try {
        var a = JSON.parse(localStorage.getItem("phoenix.appearance") || "{}");
        var p = a.theme || localStorage.getItem("phoenix.theme") || "system";
        document.documentElement.setAttribute("data-accent", a.accent || "ember");
        document.documentElement.setAttribute("data-ambient", a.ambient === false ? "off" : "on");
        var light = p === "light" || (p === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
